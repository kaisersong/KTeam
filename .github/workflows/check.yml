name: KTeam checks
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
        node: ['22.22.0', '24.16.0']
    runs-on: ${{ matrix.os }}
    # 0.3 Windows port in progress: Windows results are visible but not yet blocking.
    # Remove this line once the Windows port lands and Windows is green.
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: kteam
      - id: pins
        working-directory: kteam
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('sources.lock.json','utf8'));
          for(const source of [...lock.sources, {name:'mydocs', revision:lock.documentation.revision}]) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, source.name.replaceAll('-','_')+'='+source.revision+String.fromCharCode(10));
          }
          JS
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/kswarm
          ref: ${{ steps.pins.outputs.kswarm }}
          path: kswarm
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/intent-broker
          ref: ${{ steps.pins.outputs.intent_broker }}
          path: intent-broker
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/mydocs
          ref: ${{ steps.pins.outputs.mydocs }}
          path: mydocs
          sparse-checkout: kteam
          token: ${{ secrets.SIBLING_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: kteam
      - name: Install Electron distribution (Electron 42 no longer downloads it on postinstall)
        if: runner.os == 'macOS'
        run: node node_modules/electron/install.js
        working-directory: kteam
      - run: npm run check
        working-directory: kteam
