name: KTeam checks
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
        node: ['22.22.0', '24.16.0']
    runs-on: ${{ matrix.os }}
    # A hung test process must not hold a runner for the 6h default.
    timeout-minutes: 40
    # All platforms are blocking, including Windows.
    env:
      KTEAM_PLUGINS_SOURCE: ${{ github.workspace }}/creator-plugins
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: kteam
      - id: pins
        working-directory: kteam
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('sources.lock.json','utf8'));
          // KTeam owns its runtime copy; fetch only pinned services and report/slide plugin assets.
          for(const source of [...lock.sources,{name:'creator-plugins',revision:lock.creatorPlugins.revision}]) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, source.name.replaceAll('-','_')+'='+source.revision+String.fromCharCode(10));
          }
          JS
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/kswarm
          ref: ${{ steps.pins.outputs.kswarm }}
          path: kswarm
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/intent-broker
          ref: ${{ steps.pins.outputs.intent_broker }}
          path: intent-broker
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/kai-xiaok-plugins
          ref: ${{ steps.pins.outputs.creator_plugins }}
          path: creator-plugins
          token: ${{ secrets.SIBLING_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: kteam
      - name: Install Electron distribution (Electron 42 no longer downloads it on postinstall)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: node node_modules/electron/install.js
        working-directory: kteam
      - name: Verify private Windows host transport and independent CLI lifecycle
        if: runner.os == 'Windows'
        run: |
          npm run build
          node scripts/build-runtime.mjs
          node --test dist/tests/windows-private-host.test.js dist/tests/windows-runtime-security.test.js
          ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron.exe --test dist/tests/windows-private-host.test.js
          node scripts/smoke-cli.mjs
        timeout-minutes: 5
        working-directory: kteam
      - run: npm run check
        # Node 22 on Windows was still passing cases at the measured 25 minute cutoff.
        # Keep a finite 35 minute suite budget within the 40 minute job watchdog.
        # Every original matrix job and assertion still runs, and any failed test remains a failure.
        timeout-minutes: ${{ runner.os == 'Windows' && 35 || 10 }}
        working-directory: kteam
