name: KTeam checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
    secrets:
      SIBLING_READ_TOKEN:
        required: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, node: '22.22.0', shard: '1/1'}
          - {os: macos-15, node: '24.16.0', shard: '1/1'}
          - {os: ubuntu-latest, node: '22.22.0', shard: '1/1'}
          - {os: ubuntu-latest, node: '24.16.0', shard: '1/1'}
          - {os: windows-2022, node: '22.22.0', shard: '1/2'}
          - {os: windows-2022, node: '22.22.0', shard: '2/2'}
          - {os: windows-2022, node: '24.16.0', shard: '1/2'}
          - {os: windows-2022, node: '24.16.0', shard: '2/2'}

    runs-on: ${{ matrix.os }}
    # A hung test process must not hold a runner for the 6h default.
    timeout-minutes: 55
    # All platforms are blocking, including Windows.
    env:
      KTEAM_TEST_SHARD: ${{ matrix.shard }}
      KTEAM_PLUGINS_SOURCE: ${{ github.workspace }}/creator-plugins
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: kteam
          ref: ${{ inputs.revision || github.sha }}
      - id: pins
        working-directory: kteam
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('sources.lock.json','utf8'));
          // KTeam owns its runtime copy; fetch only pinned services and report/slide plugin assets.
          for(const source of [...lock.sources,{name:'creator-plugins',revision:lock.creatorPlugins.revision}]) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, source.name.replaceAll('-','_')+'='+source.revision+String.fromCharCode(10));
          }
          JS
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/kswarm
          ref: ${{ steps.pins.outputs.kswarm }}
          path: kswarm
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/intent-broker
          ref: ${{ steps.pins.outputs.intent_broker }}
          path: intent-broker
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/kai-xiaok-plugins
          ref: ${{ steps.pins.outputs.creator_plugins }}
          path: creator-plugins
          token: ${{ secrets.SIBLING_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: kteam
      - name: Verify bundled connector CLI
        run: node scripts/ensure-connector-cli.mjs
        working-directory: kteam
      - name: Install and verify pinned Electron / Node 24 runtime
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: |
          node node_modules/electron/install.js
          node scripts/verify-electron-runtime.mjs
        working-directory: kteam
      - name: Verify private Windows host transport and independent CLI lifecycle
        if: runner.os == 'Windows'
        run: |
          npm run build
          node scripts/build-runtime.mjs
          node --test dist/tests/windows-private-host.test.js dist/tests/windows-runtime-security.test.js
          ELECTRON_RUN_AS_NODE=1 ./node_modules/electron/dist/electron.exe --test dist/tests/windows-private-host.test.js
          node scripts/smoke-cli.mjs
        timeout-minutes: 5
        working-directory: kteam
      - run: npm run check
        # macOS runs the full suite on one runner and can exceed ten minutes.
        # Windows shards also need time for build and CLI cleanup.
        timeout-minutes: ${{ runner.os == 'Windows' && 50 || 20 }}
        working-directory: kteam
      - name: Preserve test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.node }}-${{ strategy.job-index }}
          path: kteam/build/test-reports/*.json
          if-no-files-found: error

  verify-test-coverage:
    needs: core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: .artifacts/test-reports
          merge-multiple: true
      - run: node scripts/aggregate-test-reports.mjs .artifacts/test-reports
