name: KTeam mobile
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/mobile/**'
      - 'src/protocol/**'
      - 'src/service/assistant-daily*.ts'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag on main to upload to TestFlight
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: kteam-mobile-${{ github.event.pull_request.number || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate both mobile bundles
        working-directory: mobile
        env:
          CI: '1'
        run: |
          npm ci
          npm run typecheck
          node node_modules/expo/bin/cli export --platform ios --platform android --output-dir "$RUNNER_TEMP/kteam-mobile-bundles"
      - name: Compile the iOS simulator app
        working-directory: mobile
        env:
          CI: '1'
        run: |
          node node_modules/expo/bin/cli prebuild --platform ios --no-install
          pod install --project-directory=ios
          xcodebuild -workspace ios/KTeam.xcworkspace -scheme KTeam -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/kteam-ios-check" \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Start the compiled app on iOS
        run: |
          simulator="$(xcrun simctl list devices available -j | node -e '
            const data=JSON.parse(require("node:fs").readFileSync(0,"utf8"));
            const options=Object.entries(data.devices).filter(([key])=>key.includes(".iOS-")).reverse().flatMap(([,devices])=>devices);
            const phone=options.find(device=>device.name.startsWith("iPhone")&&device.state==="Shutdown");
            if(!phone)throw Error("iOS simulator unavailable");
            process.stdout.write(phone.udid);
          ')"
          xcrun simctl boot "$simulator"
          trap 'xcrun simctl shutdown "$simulator" || true' EXIT
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$RUNNER_TEMP/kteam-ios-check/Build/Products/Release-iphonesimulator/KTeam.app"
          xcrun simctl launch "$simulator" com.kteam.mobile
          deadline=$((SECONDS+15))
          while (( SECONDS < deadline )); do
            xcrun simctl spawn "$simulator" launchctl list | awk '$1 ~ /^[0-9]+$/ && $3 ~ /com[.]kteam[.]mobile/ {found=1} END {exit !found}'
            sleep 3
          done

  testflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const version=JSON.parse(readFileSync('package.json','utf8')).version;
          const app=JSON.parse(readFileSync('mobile/app.json','utf8')).expo;
          const mobile=JSON.parse(readFileSync('mobile/package.json','utf8'));
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) ||
            process.env.RELEASE_TAG !== 'v'+version || app.version !== version || mobile.version !== version ||
            app.ios.bundleIdentifier !== 'com.kteam.mobile' || !/^[1-9]\d*$/.test(app.ios.buildNumber)) {
            throw Error('mobile_release_identity_mismatch');
          }
          JS
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Prepare iOS release sources
        working-directory: mobile
        env:
          CI: '1'
        run: |
          npm ci
          node node_modules/expo/bin/cli prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Archive and upload to TestFlight
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing Apple team}" "${APPLE_API_KEY_ID:?Missing App Store Connect key ID}"
          : "${APPLE_API_ISSUER:?Missing App Store Connect issuer}" "${APPLE_API_KEY_P8_BASE64:?Missing App Store Connect key}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/kteam-sign.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export APPLE_AUTH_KEY_PATH="$signing_dir/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$APPLE_AUTH_KEY_PATH"
          unset APPLE_API_KEY_P8_BASE64
          node scripts/testflight-status.mjs ensure-new
          cat > "$signing_dir/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$APPLE_AUTH_KEY_PATH"
            -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          xcodebuild -workspace ios/KTeam.xcworkspace -scheme KTeam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/KTeam.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive -quiet
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KTeam.xcarchive" \
            -exportPath "$RUNNER_TEMP/kteam-testflight" -exportOptionsPlist "$signing_dir/export.plist" "${auth[@]}"
          node scripts/testflight-status.mjs wait
