appId: com.kteam.desktop
productName: KTeam
electronVersion: 42.11.16
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - build/**
  - package.json
  - LICENSE
  - NOTICE
extraResources:
  - from: desktop/yzj-cli/runner.cjs
    to: yzj-cli/runner.cjs
  - from: node_modules/@yunzhijia/cli
    to: yzj-cli/package
  - from: node_modules/@yunzhijia/cli/skills/yzj-cli
    to: skills/yzj-cli
  - from: desktop/bin
    to: bin
  - from: desktop/skills
    to: skills
  - from: desktop/app-update.yml
    to: app-update.yml
asar: true
asarUnpack:
  - build/plugins/**
  - build/host.cjs
  - build/native-child.cjs
  - build/agent-cli.cjs
  - build/shared/**
  - build/service-owner.cjs
  - build/service-child.cjs
  - build/services/**
  - node_modules/**
npmRebuild: false
publish:
  provider: github
  owner: kaisersong
  repo: KTeam
  releaseType: draft
mac:
  icon: desktop/assets/icon.icns
  category: public.app-category.productivity
  target:
    - dir
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: desktop/assets/entitlements.mac.plist
  entitlementsInherit: desktop/assets/entitlements.mac.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: KTeam 在你点击语音输入后使用麦克风，将录音转为文字。
dmg:
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
# Windows x64: NSIS installer (auto-update via latest.yml + blockmap from the publish feed above)
# plus a portable exe (no auto-update). Unsigned: no Windows code signing yet (SmartScreen will warn).
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-win.${ext}
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KTeam
  artifactName: ${productName}-setup-${version}.${ext}
portable:
  artifactName: ${productName}-portable-${version}.${ext}
