<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" class="lv-menu-character" role="img" aria-label="菜单栏小 K 动作示意"><style>.lv-character .lv-action-body{transform-origin:50px 80px}.lv-character .lv-idle-body{transform-origin:50px 80px}.lv-character .lv-gaze{transform-origin:61px 60px}.lv-character .lv-blink{transform-origin:61px 60px}.lv-character.is-alive .lv-idle-body{animation:lv-breath 6.6s ease-in-out infinite}.lv-character.is-alive .lv-gaze{animation:lv-attend 7.4s ease-in-out infinite}.lv-character.is-alive .lv-blink{animation:lv-blink-idle 5.8s infinite}.lv-character.perform-blink .lv-blink{animation:lv-blink-once .32s ease-in-out 1!important}.lv-character.perform-nod .lv-action-body{animation:lv-nod .9s ease-in-out 1}.lv-character.perform-pop .lv-action-body{animation:lv-pop .7s cubic-bezier(.3,.1,.2,1) 1}.lv-paused .lv-character *{animation-play-state:paused!important}.lv-menu-character .lv-menu-eyes{transform-origin:10px 11px}.lv-menu-character.perform-blink .lv-menu-eyes{animation:lv-blink-once .32s ease-in-out 1}.lv-menu-character.perform-nod .lv-menu-body{transform-origin:10px 17px;animation:lv-mini-nod .9s ease-in-out 1}
@keyframes lv-blink-idle{0%,61%,66%,100%{transform:scaleY(1)}63%{transform:scaleY(.06)}64%{transform:scaleY(.06)}}@keyframes lv-blink-once{0%,100%{transform:scaleY(1)}45%,58%{transform:scaleY(.05)}}@keyframes lv-breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.8px) scale(1.012,.992)}}@keyframes lv-attend{0%,35%,75%,100%{transform:translate(0,0)}45%,62%{transform:translate(-.9px,-.5px)}}@keyframes lv-nod{0%,100%{transform:translateY(0) rotate(0)}35%,70%{transform:translateY(2.8px) rotate(4deg) scale(1.025,.96)}52%{transform:translateY(.4px) rotate(.5deg)}}@keyframes lv-pop{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(2px) scale(1.08,.91)}58%{transform:translateY(-4px) scale(.97,1.04)}82%{transform:translateY(.8px) scale(1.02,.985)}}@keyframes lv-mini-nod{0%,100%{transform:translateY(0)}40%,72%{transform:translateY(.6px) scaleY(.95)}}
